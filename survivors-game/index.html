	margin: 0;

  background: radial-gradient(120% 60% at 30% 0%, var(--shell-glow), transparent 60%),

  font-weight: 800; letter-spacing: 2px; font-size: 12px; }
#gb-brand { position: absolute; pointer-events: none; transform: translateX(-50%); color: var(--ink); white-space: nowrap;

  box-shadow: inset 0 4px 12px rgba(0,0,0,0.35), 0 2px 0 rgba(255,255,255,0.25); }

<script>
window.gameboy = { active: false, x: 0, y: 0, interact: 0, start: 0, select: 0,
  up: false, down: false, left: false, right: false, primary: '',
  tap_up: 0, tap_down: 0, tap_left: 0, tap_right: 0, portal: 0 };
(function () {
  // Stop phones from zooming when the controls are tapped quickly
  // (Safari on iPhone ignores the page's no-zoom setting, so the zoom
  // gestures themselves are cancelled).
  const stop = function (e) { if (e.cancelable) e.preventDefault(); };
  document.addEventListener('dblclick', stop, { passive: false });
  ['gesturestart', 'gesturechange', 'gestureend'].forEach(function (type) {
    document.addEventListener(type, stop, { passive: false });
  });
  document.addEventListener('touchmove', function (e) { if (e.touches.length > 1 || e.scale !== undefined && e.scale !== 1) stop(e); }, { passive: false });
  document.addEventListener('touchend', stop, { passive: false });
  document.addEventListener('DOMContentLoaded', function () {
    const meta = document.querySelector('meta[name=viewport]');
    if (meta) meta.setAttribute('content', 'width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover');
  });
})();
(function () {
  const gb = window.gameboy;
  const touch = (window.matchMedia && window.matchMedia('(pointer: coarse)').matches) || navigator.maxTouchPoints > 0;
  const el = {};
  let stickId = null, center = { x: 0, y: 0 }, reach = 50;
  let dpadId = null;
  // While a real controller is in use, the game fills the screen instead
  // (the game calls this; touching the screen switches back).
  let controller = false;
  gb.setController = function (on) { controller = !!on; layout(); };
  const buzz = function (ms) { if (navigator.vibrate) navigator.vibrate(ms); };

  function build() {
    const pad = document.createElement('div');
    pad.id = 'gameboy';
    pad.innerHTML =
      '<div id=gb-brand>AnnoraBoy</div>' +
      '<div id=gb-stick-zone></div><div id=gb-stick-base><div id=gb-stick-knob></div></div>' +
      '<div id=gb-dpad><div class=\'bar h\'></div><div class=\'bar v\'></div>' +
        '<div class=\'arm up\'></div><div class=\'arm down\'></div><div class=\'arm left\'></div><div class=\'arm right\'></div>' +
        '<div class=dimple></div></div>' +
      '<div id=gb-interact><svg viewBox=\'0 0 24 24\'><path fill=\'#fff\' d=\'M7 11V5.5a1.5 1.5 0 0 1 3 0V10h.5V3.5a1.5 1.5 0 0 1 3 0V10h.5V4.5a1.5 1.5 0 0 1 3 0V11h.5V7.5a1.5 1.5 0 0 1 3 0V15a7 7 0 0 1-7 7h-1a7 7 0 0 1-6.2-3.8L3.6 14.6a1.5 1.5 0 0 1 2.4-1.8z\'/></svg></div>' +
      '<div id=gb-interact-label class=gb-label>INTERACT</div>' +
      '<div id=gb-select class=gb-pill></div><div id=gb-select-label class=gb-label>SELECT</div>' +
      '<div id=gb-portal class=gb-pill></div>' +
      '<div id=gb-portal-label class=gb-label>PORTAL</div>' +
      '<div id=gb-start class=gb-pill></div><div id=gb-start-label class=gb-label>START</div>';
    document.body.appendChild(pad);
    el.pad = pad;
    ['brand', 'stick-zone', 'stick-base', 'stick-knob', 'dpad', 'interact', 'interact-label',
     'select', 'select-label', 'start', 'start-label', 'portal', 'portal-label'].forEach(function (id) {
      el[id] = document.getElementById('gb-' + id);
    });
    el.arms = {};
    ['up', 'down', 'left', 'right'].forEach(function (d) { el.arms[d] = el.dpad.querySelector('.arm.' + d); });

    // Thumbstick: the knob leans toward your thumb from the fixed center.
    const zone = el['stick-zone'];
    zone.addEventListener('pointerdown', function (e) {
      if (stickId !== null) return;
      stickId = e.pointerId;
      zone.setPointerCapture(stickId);
      moveStick(e);
      e.preventDefault();
    });
    zone.addEventListener('pointermove', function (e) { if (e.pointerId === stickId) moveStick(e); });
    ['pointerup', 'pointercancel', 'lostpointercapture'].forEach(function (type) {
      zone.addEventListener(type, function (e) { if (e.pointerId === stickId) releaseStick(); });
    });

    // D-pad: slide your thumb around it; diagonals press two directions.
    const dpad = el.dpad;
    dpad.addEventListener('pointerdown', function (e) {
      if (dpadId !== null) return;
      dpadId = e.pointerId;
      dpad.setPointerCapture(dpadId);
      moveDpad(e);
      e.preventDefault();
    });
    dpad.addEventListener('pointermove', function (e) { if (e.pointerId === dpadId) moveDpad(e); });

    [['interact', 'interact', 12], ['select', 'select', 8], ['start', 'start', 8], ['portal', 'portal', 15]].forEach(function (b) {

        button.classList.add('down');

      });
    });
    pad.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  }

  function moveStick(e) {
    const r = el.pad.getBoundingClientRect();
    let dx = e.clientX - r.left - center.x, dy = e.clientY - r.top - center.y;
    const len = Math.hypot(dx, dy);
    if (len > reach) { dx *= reach / len; dy *= reach / len; }

    gb.y = dy / reach;
  }

  function releaseStick() {
    stickId = null;
    el['stick-knob'].style.transform = '';
    gb.x = 0;
    gb.y = 0;
  }

  function moveDpad(e) {
    const r = el.dpad.getBoundingClientRect();
    const dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height / 2);

      // Only a clearly diagonal press holds two directions.
      if (Math.min(ax, ay) > Math.max(ax, ay) * 0.65) { held[h] = true; held[v] = true; }

    setDpad(held, primary);
  }

  function setDpad(held, primary) {
    ['up', 'down', 'left', 'right'].forEach(function (d) {
      gb[d] = !!held[d];
      el.arms[d].classList.toggle('on', !!held[d]);
    });
    if (primary && primary !== gb.primary) {
      gb['tap_' + primary] += 1;
      buzz(8);
    }
    gb.primary = primary;
  }

  function place(node, x, y, size) {
    node.style.left = x + 'px';
    node.style.top = y + 'px';
    if (size) node.style.width = node.style.height = size + 'px';
  }

  function layout() {
    const canvas = document.getElementById('canvas');
    if (!canvas || !document.body) return;
    if (!el.pad) build();
    const w = window.innerWidth, h = window.innerHeight, dpr = window.devicePixelRatio || 1;
    let screenH = h;
    let on = touch && h > w && !controller;
    if (on) {
      // A square screen if there's room, never shorter than 4:3.
      screenH = Math.round(Math.min(w, h - w * 0.75));
      if (screenH < w * 0.75) { on = false; screenH = h; }
    }
    document.body.classList.toggle('gameboy-mode', on);
    gb.active = on;
    canvas.style.width = w + 'px';
    canvas.style.height = screenH + 'px';
    const cw = Math.round(w * dpr), ch = Math.round(screenH * dpr);
    if (canvas.width !== cw) canvas.width = cw;
    if (canvas.height !== ch) canvas.height = ch;
    if (!on) {
      if (stickId !== null) releaseStick();
      return;
    }
    // Lay out the controller.
    const padH = h - screenH;
    el.pad.style.top = screenH + 'px';
    // Thumbstick in the top-left quarter.
    const stickSize = Math.min(w * 0.36, padH * 0.4, 180);
    center = { x: w * 0.25, y: padH * 0.27 };
    place(el['stick-base'], center.x, center.y, stickSize);
    reach = stickSize * 0.36;
    const zone = el['stick-zone'];
    zone.style.width = (w * 0.5) + 'px';
    zone.style.height = (padH * 0.5) + 'px';
    // D-pad below it.
    const dpadSize = Math.min(w * 0.44, padH * 0.42, 210);
    place(el.dpad, w * 0.25, padH * 0.73, dpadSize);
    // Interact on the right.
    const buttonSize = Math.min(w * 0.27, padH * 0.28, 130);
    const by = padH * 0.36;
    place(el.interact, w * 0.75, by, buttonSize);
    place(el['interact-label'], w * 0.75, by + buttonSize * 0.5 + 14);
    // Select and Start under it.
    // Select, Portal and Start in a row under Interact.
    const pillW = Math.min(w * 0.13, 60), py = padH * 0.8;
    [['select', 0.585], ['portal', 0.745], ['start', 0.905]].forEach(function (p) {
      const pill = el[p[0]];
      pill.style.width = pillW + 'px';
      pill.style.height = (pillW * 0.32) + 'px';
      place(pill, w * p[1], py);
      place(el[p[0] + '-label'], w * p[1], py + pillW * 0.3 + 6);
    });
    place(el.brand, w * 0.5, Math.max(8, padH * 0.025));
    el.brand.style.fontSize = Math.round(Math.min(20, w * 0.048)) + 'px';
  }

  window.addEventListener('resize', layout);
  window.addEventListener('orientationchange', function () { setTimeout(layout, 150); });
  if (window.visualViewport) window.visualViewport.addEventListener('resize', layout);
  document.addEventListener('DOMContentLoaded', layout);
  setInterval(layout, 1000);  // Catches odd phone resizes that send no event.
})();

	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}

		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');

			'onProgress': function (current, total) {
