<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
		<title>Your First 2D Game With Godot 4: START (GDQuest)</title>
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: #242424;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}
		</style>
		<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>
<style>
/* No double-tap zoom, pinch zoom, text selection or tap flashes anywhere. */
html, body { touch-action: none; -webkit-user-select: none; user-select: none;
  -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; overscroll-behavior: none; }
#gameboy { display: none; position: fixed; left: 0; right: 0; bottom: 0; overflow: hidden;
  background: linear-gradient(180deg, #dcd8e4 0%, #c6c1d2 100%);
  box-shadow: inset 0 6px 10px -6px rgba(0,0,0,0.45);
  touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
  font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; }
body.gameboy-mode #gameboy { display: block; }
#gb-brand { position: absolute; left: 0; right: 0; text-align: center; color: #4b3f72;
  font-weight: 800; font-style: italic; letter-spacing: 3px; opacity: 0.75; }
#gb-stick-zone { position: absolute; left: 0; top: 0; bottom: 0; width: 55%; }
#gb-stick-base { position: absolute; border-radius: 50%; transform: translate(-50%, -50%);
  background: radial-gradient(circle at 50% 45%, #b9b3c6, #9f98b0);
  box-shadow: inset 0 4px 12px rgba(0,0,0,0.3), 0 2px 0 rgba(255,255,255,0.7); }
#gb-stick-knob { position: absolute; left: 50%; top: 50%; width: 48%; height: 48%; margin: -24% 0 0 -24%;
  border-radius: 50%; background: radial-gradient(circle at 40% 35%, #5f586e, #2f2a3a);
  box-shadow: 0 5px 8px rgba(0,0,0,0.35); }
#gb-interact { position: absolute; border-radius: 50%; transform: translate(-50%, -50%);
  background: radial-gradient(circle at 40% 35%, #db4677, #a3194b);
  box-shadow: 0 6px 0 #6e0f30, 0 10px 14px rgba(0,0,0,0.3);
  display: flex; align-items: center; justify-content: center; }
#gb-interact.down { transform: translate(-50%, -50%) translateY(5px);
  box-shadow: 0 1px 0 #6e0f30, 0 3px 6px rgba(0,0,0,0.3); }
#gb-interact svg { width: 46%; height: 46%; }
#gb-interact-label { position: absolute; transform: translateX(-50%); color: #4b3f72;
  font-weight: 800; letter-spacing: 2px; font-size: 14px; }
#gb-speaker { position: absolute; right: 9%; bottom: 7%; display: flex; gap: 7px; transform: rotate(-28deg); }
#gb-speaker span { width: 6px; height: 46px; border-radius: 3px; background: #a49db4;
  box-shadow: inset 0 2px 3px rgba(0,0,0,0.35); }
</style>
<script>
window.gameboy = { active: false, x: 0, y: 0, interact: 0 };
(function () {
  // Stop phones from zooming when the controls are tapped quickly
  // (Safari on iPhone ignores the page's no-zoom setting, so the zoom
  // gestures themselves are cancelled).
  const stop = function (e) { if (e.cancelable) e.preventDefault(); };
  document.addEventListener('dblclick', stop, { passive: false });
  ['gesturestart', 'gesturechange', 'gestureend'].forEach(function (type) {
    document.addEventListener(type, stop, { passive: false });
  });
  document.addEventListener('touchmove', function (e) { if (e.touches.length > 1 || e.scale !== undefined && e.scale !== 1) stop(e); }, { passive: false });
  document.addEventListener('touchend', stop, { passive: false });
  document.addEventListener('DOMContentLoaded', function () {
    const meta = document.querySelector('meta[name=viewport]');
    if (meta) meta.setAttribute('content', 'width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover');
  });
})();
(function () {
  const touch = (window.matchMedia && window.matchMedia('(pointer: coarse)').matches) || navigator.maxTouchPoints > 0;
  let pad, zone, base, knob, button, label, brand;
  let stickId = null, center = { x: 0, y: 0 }, rest = { x: 0, y: 0 }, reach = 50;

  function build() {
    pad = document.createElement('div');
    pad.id = 'gameboy';
    pad.innerHTML =
      '<div id=gb-brand>SURVIVORS</div>' +
      '<div id=gb-stick-zone><div id=gb-stick-base><div id=gb-stick-knob></div></div></div>' +
      '<div id=gb-interact><svg viewBox=\'0 0 24 24\'><path fill=\'#fff\' d=\'M7 11V5.5a1.5 1.5 0 0 1 3 0V10h.5V3.5a1.5 1.5 0 0 1 3 0V10h.5V4.5a1.5 1.5 0 0 1 3 0V11h.5V7.5a1.5 1.5 0 0 1 3 0V15a7 7 0 0 1-7 7h-1a7 7 0 0 1-6.2-3.8L3.6 14.6a1.5 1.5 0 0 1 2.4-1.8z\'/></svg></div>' +
      '<div id=gb-interact-label>INTERACT</div>' +
      '<div id=gb-speaker><span></span><span></span><span></span><span></span><span></span><span></span></div>';
    document.body.appendChild(pad);
    zone = document.getElementById('gb-stick-zone');
    base = document.getElementById('gb-stick-base');
    knob = document.getElementById('gb-stick-knob');
    button = document.getElementById('gb-interact');
    label = document.getElementById('gb-interact-label');
    brand = document.getElementById('gb-brand');

    zone.addEventListener('pointerdown', function (e) {
      if (stickId !== null) return;
      stickId = e.pointerId;
      zone.setPointerCapture(stickId);
      const r = pad.getBoundingClientRect();
      center = { x: e.clientX - r.left, y: e.clientY - r.top };
      placeBase(center);
      moveStick(e);
      e.preventDefault();
    });
    zone.addEventListener('pointermove', function (e) { if (e.pointerId === stickId) moveStick(e); });
    ['pointerup', 'pointercancel', 'lostpointercapture'].forEach(function (type) {
      zone.addEventListener(type, function (e) { if (e.pointerId === stickId) releaseStick(); });
    });
    button.addEventListener('pointerdown', function (e) {
      window.gameboy.interact += 1;
      button.classList.add('down');
      if (navigator.vibrate) navigator.vibrate(12);
      e.preventDefault();
    });
    ['pointerup', 'pointercancel', 'pointerleave'].forEach(function (type) {
      button.addEventListener(type, function () { button.classList.remove('down'); });
    });
    pad.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  }

  function placeBase(p) { base.style.left = p.x + 'px'; base.style.top = p.y + 'px'; }

  function moveStick(e) {
    const r = pad.getBoundingClientRect();
    let dx = e.clientX - r.left - center.x, dy = e.clientY - r.top - center.y;
    const len = Math.hypot(dx, dy);
    if (len > reach) { dx *= reach / len; dy *= reach / len; }
    knob.style.transform = 'translate(' + dx + 'px,' + dy + 'px)';
    window.gameboy.x = dx / reach;
    window.gameboy.y = dy / reach;
  }

  function releaseStick() {
    stickId = null;
    center = rest;
    placeBase(rest);
    knob.style.transform = '';
    window.gameboy.x = 0;
    window.gameboy.y = 0;
  }

  function layout() {
    const canvas = document.getElementById('canvas');
    if (!canvas || !document.body) return;
    if (!pad) build();
    const w = window.innerWidth, h = window.innerHeight, dpr = window.devicePixelRatio || 1;
    let screenH = h;
    let on = touch && h > w;
    if (on) {
      // A square screen if there's room, never shorter than 4:3.
      screenH = Math.round(Math.min(w, h - w * 0.6));
      if (screenH < w * 0.75) { on = false; screenH = h; }
    }
    document.body.classList.toggle('gameboy-mode', on);
    window.gameboy.active = on;
    canvas.style.width = w + 'px';
    canvas.style.height = screenH + 'px';
    const cw = Math.round(w * dpr), ch = Math.round(screenH * dpr);
    if (canvas.width !== cw) canvas.width = cw;
    if (canvas.height !== ch) canvas.height = ch;
    if (!on) { if (stickId !== null) releaseStick(); return; }
    // Lay out the controller.
    const padH = h - screenH;
    pad.style.top = screenH + 'px';
    const stickSize = Math.min(w * 0.38, padH * 0.5, 190);
    base.style.width = base.style.height = stickSize + 'px';
    reach = stickSize * 0.36;
    rest = { x: w * 0.27, y: padH * 0.5 };
    if (stickId === null) { center = rest; placeBase(rest); }
    const buttonSize = Math.min(w * 0.27, padH * 0.36, 130);
    button.style.width = button.style.height = buttonSize + 'px';
    button.style.left = (w * 0.75) + 'px';
    button.style.top = (padH * 0.46) + 'px';
    label.style.left = (w * 0.75) + 'px';
    label.style.top = (padH * 0.46 + buttonSize * 0.5 + 16) + 'px';
    brand.style.top = Math.max(10, padH * 0.06) + 'px';
    brand.style.fontSize = Math.round(Math.min(18, w * 0.04)) + 'px';
  }

  window.addEventListener('resize', layout);
  window.addEventListener('orientationchange', function () { setTimeout(layout, 150); });
  if (window.visualViewport) window.visualViewport.addEventListener('resize', layout);
  document.addEventListener('DOMContentLoaded', layout);
  setInterval(layout, 1000);  // Catches odd phone resizes that send no event.
})();
</script>

	<body>
		<canvas id="canvas">
			Your browser does not support the canvas tag.

		<noscript>

		<div id="status">
			<img id="status-splash" class="show-image--true fullsize--true use-filter--true" src="index.png" alt="">
			<progress id="status-progress"></progress>
			<div id="status-notice"></div>
		</div>

		<script src="index.js"></script>
		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":0,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":682460,"index.wasm":38034280},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>
